<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>남양주 기억마실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06090f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
/* 다크 단일 테마. 강조색은 시그널 블루 하나, 경고만 노랑. 그림자 없음.
   화면 구조: 기기(PC는 아이폰 프레임, 폰은 전체 화면) 안에 상단 헤더 · 스크롤 영역 · 하단 탭바 · 시트 층 · 완료 축하 층 */
:root{
  color-scheme:dark;
  --bg:#06090f;--card:#0c1016;--line:#202733;--inset:#10151d;--raise:#151b24;
  --text:#e2ecef;--text-2:#b9c4cd;--muted:#8294a1;
  --accent:#38bdf8;--accent-weak:rgba(56,189,248,.14);--accent-line:rgba(56,189,248,.55);--on-accent:#06090f;
  --warn:#fbbf24;--warn-weak:rgba(251,191,36,.13);--warn-line:rgba(251,191,36,.45);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sat:0px;--sab:0px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{list-style:none;padding:0}
a{color:inherit}
img,video{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 무대와 기기 */
.stage{min-height:100%}
html[data-frame="pc"] .stage{display:grid;justify-items:center;align-content:center;gap:12px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[data-frame="pc"] .dwrap{position:relative;width:calc(417px * var(--fs,1));height:calc(876px * var(--fs,1))}
html[data-frame="pc"] .device{position:absolute;top:0;left:0;width:417px;height:876px;transform:scale(var(--fs,1));transform-origin:0 0;border:12px solid #000;border-radius:62px;outline:3px solid #262d38;background:var(--bg);overflow:hidden;--sat:54px;--sab:28px}
html[data-frame="phone"] .stage{position:fixed;inset:0}
html[data-frame="phone"] .dwrap{position:absolute;inset:0}
html[data-frame="phone"] .device{position:absolute;inset:0;background:var(--bg);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html[data-frame="phone"] .statusbar,html[data-frame="phone"] .homebar,html[data-frame="phone"] .stage-cap{display:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--sat);z-index:40;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;background:var(--bg);color:var(--text);font:600 16px/1 var(--font)}
.sb-time{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.sb-icons{display:flex;align-items:center;gap:7px}
.sb-icons svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#e2ecef;z-index:45;pointer-events:none}
.stage-cap{font-size:12.5px;color:var(--muted);text-align:center}
.viewport{position:absolute;top:var(--sat);left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}

/* 헤더 · 스크롤 · 탭바 */
.appbar{position:absolute;top:0;left:0;right:0;z-index:10;height:56px;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line);transition:transform .22s ease}
.appbar.hide{transform:translateY(-101%)}
.viewport.no-appbar .appbar{display:none}
.viewport.elder .appbar{height:64px}
.ab-brand{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:18px}
.viewport.elder .ab-brand{font-size:28px}
.ab-brand .logo{width:30px;height:30px;color:var(--text)}
.viewport.elder .ab-brand .logo{width:40px;height:40px}
.ab-title{font-size:17px;font-weight:700;margin-right:auto;min-width:0}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:56px;padding-bottom:calc(var(--sab) + 28px)}
.viewport.no-appbar .scroller{padding-top:0}
.viewport.elder .scroller{padding-top:64px}
.viewport.has-tabbar .scroller{padding-bottom:calc(64px + var(--sab) + 20px)}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:none;grid-template-columns:repeat(4,minmax(0,1fr));height:calc(64px + var(--sab));padding-bottom:var(--sab);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:var(--bg);border-top:1px solid var(--line)}
.viewport.has-tabbar .tabbar{display:grid}
.tab{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;min-height:48px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--warn);color:var(--bg);font:700 10.5px/17px var(--mono);text-align:center}

/* 공통 조각 */
.page{display:grid;gap:12px;max-width:560px;margin:0 auto;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.c-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.c-label{font-size:14px;font-weight:500;color:var(--text-2)}
.c-title{font-size:16px;font-weight:700}
.c-date{font:500 12.5px var(--mono);color:var(--muted)}
.c-h{font-size:19px;font-weight:700;line-height:1.4}
.c-p{font-size:14.5px;color:var(--text-2)}
.c-note{font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:500;font-size:15px;line-height:1.35;text-align:center;text-decoration:none}
.btn:hover{border-color:#2e3848}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{background:#5ccbfa}
.btn.quiet{background:transparent}
.btn.block{display:flex;width:100%}
.btn.small{min-height:44px;padding:8px 12px;font-size:14px}
.btn.confirm{border-color:var(--warn-line);background:var(--warn-weak);color:var(--warn);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:transparent;color:var(--muted)}
.icon-btn:hover{color:var(--text);background:var(--inset)}
.icon-btn svg{width:22px;height:22px}
.badge{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:5px 10px;border-radius:999px;background:var(--inset);color:var(--text-2);font-size:13px;font-weight:700;line-height:1.35;justify-self:start}
.badge svg{width:15px;height:15px;flex:none}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.accent{background:var(--accent-weak);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--raise);border:1px solid var(--line);color:var(--text-2);font-weight:700;object-fit:cover;overflow:hidden;line-height:1}
.code{font:700 30px/1.2 var(--mono);letter-spacing:.08em;text-align:center;padding:14px 10px;border-radius:12px;background:var(--inset);border:1px dashed var(--line)}

/* 프로필 줄 */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px;min-width:0}
.carousel::-webkit-scrollbar{display:none}
.pcard{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;min-height:76px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;min-width:0}
.pcard.add{grid-template-columns:24px minmax(0,1fr);color:var(--accent);border-style:dashed;font-weight:700}
.pcard.add svg{width:22px;height:22px}
.pinfo{display:grid;gap:1px;min-width:0}
.pinfo b{font-size:16px;font-weight:700;line-height:1.3}
.pinfo span{font-size:13px;color:var(--text-2);line-height:1.35}
.pinfo .pst{justify-self:start;margin-top:3px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--inset);color:var(--text-2)}
.pinfo .pst.warn{background:var(--warn-weak);color:var(--warn)}
.wsel{position:relative;display:block}
.wsel select{appearance:none;-webkit-appearance:none;width:100px;height:100%;min-height:76px;padding:0 28px 0 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:700}
.wsel svg{position:absolute;right:8px;top:50%;width:16px;height:16px;margin-top:-8px;pointer-events:none;color:var(--muted)}
.pdots{display:flex;justify-content:center;margin-top:-6px}
.pdot{width:30px;height:28px;display:grid;place-items:center;padding:0;border:0;background:none}
.pdot i{width:6px;height:6px;border-radius:3px;background:#2c3542}
.pdot.on i{width:18px;background:var(--accent)}

/* 리포트 */
.verdict{gap:10px}
.verdict.watch{border-color:var(--warn-line)}
.verdict.persist{border-color:var(--warn)}
.v-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.v-when{font:500 12px var(--mono);color:var(--muted);margin-left:auto}
.v-title{font-size:21px;font-weight:700;line-height:1.4}
.v-why{font-size:14px;color:var(--text-2)}
.v-act{font-size:15.5px;font-weight:700}
.v-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
.v-calls{font-size:12.5px;color:var(--text-2)}
.topics{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--inset)}
.topics b{font-size:12.5px;color:var(--accent);font-weight:700}
.topics p{font-size:14px;line-height:1.5}
.big{display:flex;align-items:baseline;gap:6px;margin-top:-2px}
.big-num{font:700 60px/1 var(--mono);letter-spacing:-.03em}
.big-unit{font:500 22px var(--mono);color:var(--text-2)}
.sumcard{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:14px 4px}
.sum{display:grid;gap:4px;align-content:start;padding:3px 10px 2px;border-left:1px solid var(--line);min-width:0}
.sum:first-child{border-left:0}
.sum-l{font-size:12.5px;color:var(--text-2);line-height:1.5}
.sum-v{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:1px;line-height:1.15}
.sum-v b{font:700 26px/1.1 var(--mono)}
.sum-v b.txt{font:700 19px/1.25 var(--font)}
.sum-v small{font:500 13px var(--mono);color:var(--text-2)}
.sum-v.warn b{color:var(--warn)}
.sum-s{font-size:12px;color:var(--muted);line-height:1.35}
.banner{display:grid;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--warn-line);background:var(--warn-weak)}
.banner b{color:var(--warn);font-size:15px}
.banner span{font-size:13px;color:var(--text-2)}
.goods{display:grid;gap:8px}
.goods li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14.5px}
.goods li svg{width:18px;height:18px;color:var(--accent);margin-top:3px}
.wm{display:grid;gap:6px}
.wm-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-size:13.5px;color:var(--text-2)}
.wm-top b{font:700 13.5px var(--mono);color:var(--text)}
.bar{height:8px;border-radius:4px;background:var(--inset);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.post{display:grid;gap:6px;min-width:0;align-content:start}
.ph{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--inset);border:1px solid var(--line)}
.ph img,.ph video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.ph .tag{position:absolute;left:6px;top:6px;max-width:calc(100% - 12px);padding:2px 8px;border-radius:999px;background:rgba(6,9,15,.8);color:var(--text);font-size:11.5px;font-weight:700}
.post .cap{font-size:12.5px;color:var(--text-2);line-height:1.4}
.post .ai{font-size:12px;color:var(--accent);line-height:1.4}
.post .btn{min-height:44px;font-size:13px;padding:6px 10px}
/* 한눈에 보기 */
.glance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gl{display:grid;gap:4px;align-content:start;padding:12px;border-radius:14px;background:var(--inset);border:1px solid var(--line);min-width:0}
.gl.warn{border-color:var(--warn-line);background:var(--warn-weak)}
.gl-top{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);min-width:0}
.gl-top svg{width:17px;height:17px;flex:none;color:var(--accent)}
.gl.warn .gl-top svg{color:var(--warn)}
.gl-top em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.gl.warn .gl-top em{color:var(--warn)}
.gl-val{font:700 24px/1.15 var(--mono)}
.gl-val small{font:500 13px var(--font);color:var(--text-2);margin-left:2px}
.gl.warn .gl-val{color:var(--warn)}
.gl-sub{font-size:12px;color:var(--text-2);line-height:1.4}
.gl-note{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--warn)}
.gl-note svg{width:16px;height:16px;flex:none;margin-top:2px}
/* 생활표 */
.lt{display:grid}
.lt-row{display:grid;grid-template-columns:38px 76px minmax(0,1fr) 38px;gap:8px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);min-height:50px}
.lt-row:first-child{border-top:0}
.lt-row.today{background:var(--accent-weak);border-radius:10px}
.lt-row.warn .lt-d b,.lt-row.warn .lt-w{color:var(--warn)}
.lt-d{display:grid;font:500 11px var(--mono);color:var(--muted);line-height:1.2}
.lt-d b{font:700 14px var(--font);color:var(--text)}
.lt-m{display:flex;gap:3px}
.ml{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-style:normal;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted);flex:none}
.ml svg{width:13px;height:13px}
.ml.ok{background:var(--accent);border-color:var(--accent);color:#06090f}
.ml.senior{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.ml.photo{background:var(--accent);border-color:var(--accent);color:#06090f}
.ml.miss{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.ml.none{opacity:.45}
.lt-walk{display:grid;gap:3px;min-width:0}
.lt-bar{height:7px;border-radius:4px;background:var(--inset);overflow:hidden}
.lt-bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.lt-w{font-size:12px;color:var(--text-2);line-height:1.35;overflow-wrap:anywhere}
.lt-none{font-size:12px;color:var(--muted)}
.lt-ph{position:relative;width:38px;height:38px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--inset);padding:0}
.lt-ph img{width:100%;height:100%;object-fit:cover;display:block}
.lt-ph b{position:absolute;right:2px;bottom:2px;min-width:16px;padding:0 3px;border-radius:8px;background:rgba(6,9,15,.85);font:700 10.5px/16px var(--mono);color:var(--text)}
.lt-ph.empty{border-style:dashed;opacity:.35}
.lt-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:11.5px;color:var(--muted)}
.lt-legend .ml{width:18px;height:18px;font-size:9.5px;margin-right:-4px}
/* 마실 기록 · 밥상 일기 */
.wk{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:118px;padding-top:16px}
.wk-col{display:grid;justify-items:center;gap:3px;align-content:end;height:100%}
.wk-col i{display:block;width:70%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent)}
.wk-col i.zero{background:var(--warn)}
.wk-col i.na{background:var(--line)}
.wk-col b{font-size:12px;font-weight:500;color:var(--text-2)}
.wk-v{font:500 10.5px var(--mono);color:var(--text-2);white-space:nowrap}
.wk-avg{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);pointer-events:none}
.wk-col{position:relative;z-index:1}
.wk-legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:-4px}
.wk-legend i{width:18px;border-top:1px dashed var(--muted)}
.ths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ths.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.th{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--inset);padding:0;min-width:0}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th-t{position:absolute;left:4px;bottom:4px;padding:1px 6px;border-radius:999px;background:rgba(6,9,15,.8);font-size:10.5px;font-weight:700;color:var(--text)}
.ins{display:grid;gap:8px}
.ins li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;font-size:14px;line-height:1.45}
.ins li svg{width:17px;height:17px;color:var(--accent);margin-top:2px}
.ins li.warn{color:var(--warn)}
.ins li.warn svg{color:var(--warn)}
.empty-box{display:grid;gap:4px;padding:16px;border-radius:12px;background:var(--inset);text-align:center}
.empty-box b{font-size:14.5px}
.empty-box span{font-size:12.5px;color:var(--text-2)}
.sent{font-size:12.5px;color:var(--text-2)}
.qline{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:13.5px;color:var(--text-2);line-height:1.5}
.qline svg{width:18px;height:18px;margin-top:2px}
.qline.ok svg{color:var(--accent)}
.qline.gap svg{color:var(--warn)}
.spark{display:grid;grid-template-columns:64px repeat(var(--n),minmax(0,1fr));column-gap:6px;row-gap:6px;align-items:end}
.spark .lab{font-size:12.5px;color:var(--text-2);align-self:center;line-height:1.35}
.spark .col{display:grid;justify-items:center;align-content:end;gap:3px;height:74px;min-width:0}

  // 요일별 한 줄: 식사 세 칸 · 걸음 막대 · 그날 사진
  function lifeCard(el, W) {
    var m = W.m, t = S().today, posts = weekPosts(el, W), fs = E.flag(W, 'streak'), fsd = fs ? fs.dates : [];

      '<p class="lt-legend"><i class="ml ok">아</i>먹었어요 <i class="ml senior">점</i>경로당 <i class="ml photo">' + IC.cam + '</i>밥상 사진 <i class="ml miss">저</i>체크 없음</p></section>';
  }

  function walkCard(el, W) {
    var m = W.m, b = W.base, total = E.stepsKm(m.walkKm), avgDay = b ? E.stepsKm(b.walkKm) / 7 : null;
    var sps = m.per.map(function (p) { return p && !p.gap ? E.stepsKm(p.walkKm) : null; });

  function trendCard(el, A, W) {

  /* ---------- 어르신 사진 흐름: 찍기 → 위치 확인 → (질문) → 보내기 ---------- */
  async function onElderMedia(file) {
    var el = curElder(); if (!el) return;
    var isVideo = /^video\//.test(file.type), paused = !!(el.paused && el.paused.on);
    eflow = { step: 'working' }; render(); goTop();
    var pos = null, prep;
    try { prep = await prepMedia(file); } catch (e) { eflow = null; render(); toast(e && e.code === 'too_big' ? '영상이 너무 길어요. 10초 안쪽으로 찍어 주세요' : '이 사진은 열 수 없어요. 다시 찍어 주세요'); return; }
    if (!paused) { if (!isVideo) pos = await photoPos(file); if (!pos) pos = await currentPos(4000); }   // 위치 기록을 꺼 두셨으면 위치를 읽지 않는다
    var ctx = { blob: prep.blob, kind: prep.kind, isVideo: isVideo, preview: URL.createObjectURL(prep.blob), pos: pos, km: null, deg: null };
    var home = homes[el.id];
    if (pos && home) {
      ctx.km = distKm(home, pos); ctx.deg = bearing(home, pos);
      if (ctx.km >= E.RULES.homeKm) { finishPhoto(ctx, 'out'); return; }
      atHome(ctx); return;
    }
    eflow = Object.assign({ step: pos ? 'ask-home' : 'ask-where' }, ctx); render();
  }
  function atHome(ctx) {
    var el = curElder(), day = el.days[S().today] || {}, mk = ctx.isVideo ? null : E.photoMealKey(day, nowMin());
    if (mk) { eflow = Object.assign({}, ctx, { step: 'ask-meal', meal: mk }); render(); }
    else finishPhoto(ctx, 'home');
  }
  async function finishPhoto(ctx, where, meal) {
    var el = curElder(), st = S(), t = st.today, nm = nowMin(), to = seersText(el);
    eflow = Object.assign({}, ctx, { step: 'saving' }); render();
    var ref = null;
    try { ref = await mediaPut(ctx.blob); } catch (e) { ref = null; }
    if (!ref) { eflow = null; render(); toast('사진을 보내지 못했어요. 다시 해 주세요'); return; }
    var pid = newId('p'), ep = { posts: {} }, kmv = ctx.km != null ? Math.round(ctx.km * 100) / 100 : null;
    ep.posts[pid] = { id: pid, at: stamp(), media: ref, kind: ctx.kind, where: where, km: where === 'out' ? kmv : null, meal: meal || null };
    var day = el.days[t] || {}, dp = {};
    if (where === 'out') {
      var mins = kmv ? Math.max(20, Math.min(120, Math.round(2 * kmv / 3.2 * 60))) : 40, vis = (day.v || []).slice();
      vis.push({ p: 'snap', s: E.hm(Math.max(300, nm - mins)), e: E.hm(nm), km: kmv, deg: ctx.deg != null ? Math.round(ctx.deg) : null, src: 'photo', post: pid });
      dp.v = vis; dp.w = { t: nowHM() };
    }
    if (meal) { dp.m = {}; dp.m[meal] = { t: nowHM(), p: 'home', photo: ref }; }
    if (Object.keys(dp).length) { ep.days = {}; ep.days[t] = dp; }
    update(patchElder(el.id, ep));
    eflow = null; enav = { screen: 'home', id: null }; render(); goTop();
    var wkOut = vals((S().elders[el.id] || el).posts).filter(function (p) { return p.where === 'out' && !p.meal && String(p.at).split(' ')[0] >= E.mondayOf(t); }).length;
    if (where === 'out') celebrate({ title: '마실 다녀오셨네요!', sub: kmv ? '집에서 ' + E.km(kmv) + ' · 약 ' + E.steps(kmv).toLocaleString() + '걸음' : '바깥나들이를 기록했어요', next: '이번 주 마실 사진 ' + wkOut + '장째 · ' + to + '께 보냈어요', speak: '마실 다녀오셨네요. 잘하셨어요' });
    else if (meal) celebrate({ title: '잘 드셨어요!', sub: '밥상 사진을 ' + to + '께 보냈어요', next: nextText(S().elders[el.id] || el), speak: '잘 드셨어요' });
    else celebrate({ title: '사진을 보냈어요', sub: to + '이 곧 보실 거예요', speak: '사진을 보냈어요' });
  }
  function nextText(el) { var day = el.days[S().today] || {}, nx = E.nextMission(day, nowMin()); return nx ? '다음 할 일: ' + nx.label + ' · ' + timeLabel(nx.start) : ''; }

  /* ---------- 시트 ---------- */
  function renderSheet() {
    var layer = $('#layer');
    if (!sheet) { layer.classList.remove('open'); layer.innerHTML = ''; return; }
    var t = sheetHTML(); if (!t) { sheet = null; layer.classList.remove('open'); layer.innerHTML = ''; return; }
    var old = layer.querySelector('.sheet'), top = old ? old.scrollTop : 0;
    layer.innerHTML = '<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"><div class="sh-head"><h2 class="sh-title" id="sh-title">' + t.title + '</h2>' +
      '<button type="button" class="icon-btn" data-act="close-sheet" aria-label="닫기">' + IC.close + '</button></div><div class="sh-body">' + t.body + '</div></div>';
    layer.classList.add('open');
    layer.querySelector('.sheet').scrollTop = top;
    syncForm(); hydrateMedia();
  }
  function openSheet(s) { sheet = s; form = {}; renderSheet(); }
  function closeSheet() { sheet = null; form = {}; renderSheet(); }

      var baseVisits = W.base ? W.base.mondays.reduce(function (n, mon) { return n + E.placeSlots(el, mon, st.today, sheet.p).visits; }, 0) / W.base.mondays.length : null;
      var grid = '<div class="slots" role="table" aria-label="요일별 시간대"><span></span>' + E.DOW.map(function (d) { return '<span class="hd">' + d + '</span>'; }).join('') +
        E.SLOTS.map(function (sl, k) { return '<span class="rl">' + sl[0] + '</span>' + s.grid.map(function (row, i) { return '<i class="' + (row[k] ? 'on' : '') + '" title="' + E.DOW[i] + ' ' + sl[0] + (row[k] ? ' 머묾' : '') + '"></i>'; }).join(''); }).join('') + '</div>';
      return { title: E.TYPES[sheet.p], body: '<p class="c-p">' + (s.visits ? wkWord(W) + ' ' + s.visits + '번 · 모두 ' + E.dur(s.minutes) : wkWord(W) + '에는 가지 않으셨어요') + (baseVisits != null ? ' · 평소 주 ' + E.num(baseVisits) + '번' : '') + '</p>' + grid +
        '<p class="c-note">아침 6–10시 · 낮 10–14시 · 오후 14–18시 · 저녁 18–22시. 주소나 좌표는 저장하지 않고 장소 종류와 머문 시간대만 보여 드려요.</p>' };
    }

      return { title: stitle, body: mediaTag(p.media, p.kind, 'sheet-media', stitle) + '<p class="c-p">' + dayLabel(d[0]) + ' ' + esc(d[1] || '') + (p.km != null ? ' · 집에서 ' + E.km(p.km) + ' · 약 ' + E.steps(p.km).toLocaleString() + '걸음 (추정)' : '') + (p.meal ? ' · 식사 체크와 함께 들어왔어요' : '') + '</p>' +
        (p.ai ? '<p class="c-p" style="color:var(--accent)">AI 참고: ' + esc(p.ai) + '</p>' : '') +
        '<button type="button" class="btn block" data-act="reply" data-id="' + el2.id + '">' + IC.cam + '이 사진에 답장하기</button>' +
        '<p class="c-note">어르신이 사진을 찍을 때만 위치를 읽고, 가족에게는 집에서의 거리와 방향만 보내요. 사진 속 위치 정보는 지우고 보내요.</p>' };
    }

      }

      case 'e-member': enav = { screen: 'member', id: id, from: t.getAttribute('data-from') || 'people' }; render(); goTop(); return;
      case 'e-keep': { var ok3 = { circle: {} }; ok3.circle[id] = { ack: true }; enav = { screen: enav.from || 'people', id: null }; update(patchElder(el.id, ok3)); render(); goTop(); return; }
      case 'e-remove': {
        var gone = person(id), orm = { circle: {} }; orm.circle[id] = null;
        enav = { screen: enav.from === 'home' ? 'home' : 'people', id: null }; update(patchElder(el.id, orm)); render(); goTop();
        toast(gone.short + ' 님을 뺐어요. 이제 리포트를 볼 수 없어요'); say(gone.short + ' 님을 뺐어요'); return;
      }
      case 'e-mem-skip': { var ok2 = { memories: {} }; ok2.memories[id] = { answer: { skip: true, at: stamp() } }; update(patchElder(el.id, ok2)); enav = { screen: 'home', id: null }; render(); goTop(); return; }
      case 'loc': { var on = !(el.paused && el.paused.on); update(patchElder(el.id, { paused: { on: on, at: stamp() } })); toast(on ? '위치 기록을 잠시 껐어요' : '위치 기록을 다시 켰어요'); return; }
      case 'voice': ui.voice = !ui.voice; saveUI(); render(); if (ui.voice) say('소리로 안내해 드릴게요'); return;
      case 'e-step': elderStep = Math.max(0, Math.min(3, elderStep + Number(t.getAttribute('data-d')))); render(); goTop(); return;
      case 'e-agree': elderStep = 0; update(patchElder(id, { consent: { status: 'agreed', at: stamp() }, since: st.elders[id].since || st.today })); toast('고마워요. 오늘부터 기록을 시작해요'); goTop(); return;
      case 'e-later': elderStep = 0; update(patchElder(id, { consent: { status: 'declined', at: stamp() } })); toast('괜찮아요. 언제든 다시 시작할 수 있어요'); return;
      case 'e-restart': elderStep = 0; update(patchElder(id, { consent: { status: 'pending', at: null } })); return;
      case 'as-elder': ui.elderId = id; elderStep = 0; closeSheet(); setRole('elder'); return;
      case 'log-call': { var ck = newId('k'), oc = { calls: {} }; oc.calls[ck] = { id: ck, by: me().name, at: stamp() }; update(patchElder(id, oc)); toast('안부 전화를 기록했어요. 돌봄 가족이 함께 봐요'); return; }
      case 'praise': { var pm = newId('i'), op = { inbox: {} }; op.inbox[pm] = { id: pm, from: me().short, kind: 'praise', text: '잘하셨어요!', at: stamp() }; update(patchElder(id, op)); toast('어르신 화면에 칭찬을 보냈어요'); return; }
      case 'confirm-alert': { var o = { alerts: {} }; o.alerts[id] = { confirmedAt: stamp(), by: me().short }; update(o); toast('알림을 확인 완료로 바꿨어요. 돌봄 가족도 함께 봐요'); return; }
      case 'viewer': {
        if (!id || id === ui.viewer) return;
        ui.viewer = id; var vis = visibleElders(); if (vis.length && !vis.some(function (e) { return e.id === ui.elderId; })) ui.elderId = vis[0].id;
        saveUI(); nav = { tab: 'report', detail: null }; render(); goTop(); toast(person(id).name + ' 님 화면으로 바꿨어요'); return;
      }
      case 'accept-invite': {
        var apid = t.getAttribute('data-pid'), oai = { circle: {} }; oai.circle[apid] = { status: 'joined', since: st.today, code: '', ack: false };
        var keep = sheet && sheet.type === 'invite';
        update(patchElder(id, oai)); if (keep) renderSheet(); else closeSheet();
        toast(person(apid).name + ' 님이 초대를 수락했어요. 어르신 화면에도 알려 드려요'); return;
      }
      case 'member-remove': {
        if (!sheet || sheet.type !== 'member') return;
        if (!sheet.confirm) { sheet.confirm = true; renderSheet(); return; }
        var rel0 = st.elders[sheet.id], rpid = sheet.pid, rp = person(rpid), self = rpid === ui.viewer, rm0 = memberOf(rel0, rpid), orr = { circle: {} }; orr.circle[rpid] = null;
        closeSheet(); update(patchElder(sheet ? sheet.id : rel0.id, orr));
        toast(self ? rel0.name + ' 님 리포트에서 나왔어요' : rm0 && rm0.status === 'invited' ? rp.name + ' 님 초대를 취소했어요' : rp.name + ' 님을 뺐어요. 이제 리포트를 볼 수 없어요'); return;
      }
      case 'tick': { var it = t.getAttribute('data-item'), cur = ((((st.schedules || {})[id] || {}).check || {})[it] || {}).done, ot = { schedules: {} }; ot.schedules[id] = { check: {} }; ot.schedules[id].check[it] = { done: !cur }; update(ot); return; }
      case 'pick-chip': form[t.getAttribute('data-field')] = t.getAttribute('data-val'); renderSheet(); return;
      case 'save-visit': { var o2 = { schedules: {} }; o2.schedules[sheet.id] = { day: form.day, slot: form.slot, at: stamp() }; update(o2); toast(dayLabel(form.day) + ' ' + form.slot + ' 방문 일정을 넣었어요'); closeSheet(); return; }
      case 'pay': sheet.step = 'paying'; renderSheet(); setTimeout(function () { update({ plan: 'plus' }); if (sheet && sheet.type === 'pay') { sheet.step = 'done'; renderSheet(); } }, 900); return;
      case 'plan-free': update({ plan: 'free' }); toast('무료 요금제로 바꿨어요'); return;
      case 'withdraw': {
        var key = 'withdraw:' + id;
        if (confirmKey !== key) { confirmKey = key; render(); return; }
        confirmKey = null; update(patchElder(id, { consent: { status: 'withdrawn', at: stamp() } })); toast('동의를 철회했어요. 기록과 리포트를 멈춰요'); return;
      }
      case 'reinvite': update(patchElder(id, { consent: { status: 'pending', at: null, code: newCode() } })); ui.elderId = id; saveUI(); toast('새 초대 코드를 만들었어요'); return;
      case 'reset':
        if (confirmKey !== 'reset') { confirmKey = 'reset'; render(); return; }
        confirmKey = null; weekSel = {}; nav = { tab: 'settings', detail: null }; ui.elderId = 'e1'; ui.viewer = 'g1'; saveUI(); idbClear(); replaceAll(E.buildSeed()); toast('테스트 데이터를 처음으로 되돌렸어요'); return;
      case 'rel-chip': { var inp = $('#layer [data-f="' + t.getAttribute('data-target') + '"]'); if (inp) { inp.value = t.getAttribute('data-val'); readField(inp); } syncForm(); return; }
      case 'create-elder': {
        var name = (form.name || '').trim().slice(0, 10), rel = (form.relation || '').trim().slice(0, 8), area = form.area, age = parseInt(form.age, 10);
        if (!name || !rel || !area) return;
        var nid = newId('e'), layout = area === '화도읍' ? 'hwado' : /진접|오남|별내/.test(area) ? 'jinjeop' : 'sudong';
        var ne = { id: nid, name: name, short: name.length >= 3 ? name.slice(1) : name, age: age > 0 && age < 120 ? age : null, area: area, living: '', phone: '010-0000-0000', layout: layout, since: null, photo: form.photo || null,
          consent: { status: 'pending', at: null, code: newCode() }, paused: { on: false, at: null }, days: {}, posts: {}, inbox: {}, memories: {}, calls: {}, circle: {} };
        ne.circle[ui.viewer] = { role: 'main', call: rel, rel: '', since: st.today, status: 'joined', ack: true };   // 연결한 사람이 이 어르신의 주보호자
        if (form.home) saveHome(nid, form.home);
        var po2 = { elders: {}, order: (st.order || []).concat(nid) }; po2.elders[nid] = ne;
        update(po2); ui.elderId = nid; saveUI(); sheet = { type: 'connect', step: 'done', id: nid }; renderSheet(); return;
      }
      case 'create-invite': {
        var iel = st.elders[sheet.id], fname = (form.name || '').trim().slice(0, 10), frel = (form.rel || '').trim().slice(0, 8), fcall = (form.call || '').trim().slice(0, 8);
        if (!iel || !fname || !frel || !fcall) return;
        // 같은 이름의 가족이 이미 있으면 그 사람을 다시 쓴다 → 한 사람이 여러 어르신의 돌봄 가족이 될 수 있다
        var ex = personByName(fname), fid = ex ? ex.id : newId('f'), was = memberOf(iel, fid);
        if (was && (was.role === 'main' || was.status === 'joined')) { toast(fname + ' 님은 이미 함께 보고 있어요'); return; }
        var oc2 = { circle: {} }; oc2.circle[fid] = { role: 'family', call: fcall, rel: frel, since: st.today, status: 'invited', code: newCode(), ack: false };
        var fo = patchElder(iel.id, oc2); if (!ex) { fo.people = {}; fo.people[fid] = { id: fid, name: fname, short: fname.length >= 3 ? fname.slice(1) : fname }; }
        sheet = { type: 'invite', step: 'done', id: iel.id, pid: fid }; update(fo); renderSheet(); return;
      }
      case 'create-memory': {
        var q = (form.q || '').trim().slice(0, 40), blob = form.memBlob, target = sheet.id;
        if (!q || !blob) return;
        t.disabled = true; t.textContent = '보내는 중…';
        mediaPut(blob).then(function (ref) {
          var mid = newId('r'), om = { memories: {} }; om.memories[mid] = { id: mid, media: ref, q: q, by: me().short, at: stamp(), answer: null };
          update(patchElder(target, om)); closeSheet(); toast('어르신 화면에 옛날 사진을 보냈어요');
        }).catch(function () { t.disabled = false; t.textContent = '보내기'; toast('보내지 못했어요. 다시 해 주세요'); });
        return;
      }
    }
  });

  // 지도 장소는 키보드로도 연다 · 한글 조합 중 Enter는 무시
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('ptap')) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
    if (e.key === 'Enter' && t.matches && t.matches('input[data-f]')) {
      if (e.isComposing || e.keyCode === 229 || composing) return;
      e.preventDefault(); var b = $('#layer [data-submit]'); if (b && !b.disabled) b.click(); return;
    }
    if (e.key === 'Escape') { if (!$('#celebrate').hidden) hideCelebrate(); else if (sheet) closeSheet(); else if (nav.detail) { nav.detail = null; render(); } }
  });
  document.addEventListener('compositionstart', function () { composing = true; });
  document.addEventListener('compositionend', function (e) { composing = false; if (e.target.matches && e.target.matches('[data-f]')) { readField(e.target); syncForm(); } });
  document.addEventListener('input', function (e) { if (e.target.matches && e.target.matches('[data-f]')) { readField(e.target); syncForm(); } });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'week-sel') { var el = curElder(); if (el) { weekSel[el.id] = Number(t.value); render(); } return; }
    if (t.matches && t.matches('[data-f]')) { readField(t); syncForm(); }
  });

  // 헤더: 내리면 숨고 올리면 나온다
  (function () {
    var sc = $('#scroller'), bar = $('#appbar'), lastY = 0;
    sc.addEventListener('scroll', function () {
      var y = sc.scrollTop;
      if (y > lastY + 6 && y > 64) bar.classList.add('hide');
      else if (y < lastY - 6 || y < 12) bar.classList.remove('hide');
      lastY = y;
    }, { passive: true });
  })();

  // 프로필 좌우로 넘기기
  function bindCarousel() {
    var c = $('#carousel'); if (!c) return;
    var els = visibleElders(), idx = Math.max(0, els.map(function (e) { return e.id; }).indexOf(ui.elderId));
    var step = c.children.length > 1 ? c.children[1].offsetLeft - c.children[0].offsetLeft : c.clientWidth;
    c.scrollLeft = idx * step;
    var timer = null;
    c.addEventListener('scroll', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { var i = Math.round(c.scrollLeft / (step || 1)); if (i < els.length && els[i].id !== ui.elderId) { ui.elderId = els[i].id; saveUI(); render(); } }, 140);
    }, { passive: true });
  }

  async function doDownload() {
    if (!caps.downloads) { toast('이 화면에서는 내려받을 수 없어요'); return; }
    try {
      var res = await fetch('kiokmasil-offline.html'); if (!res.ok) throw new Error('fetch');
      await caps.downloads.save({ filename: '기억마실-오프라인.html', data: await res.text() });
      toast('HTML 파일을 내려받았어요');
    } catch (e) { if (e && e.code === 'declined') return; toast('내려받지 못했어요. 잠시 뒤 다시 눌러 주세요'); }
  }

  /* ---------- 아이폰 프레임 ---------- */
  function frameMode() { var h = (location.hash || '').slice(1); if (h === 'pc' || h === 'phone') return h; return (innerWidth >= 760 && innerHeight >= 560) ? 'pc' : 'phone'; }
  function layoutFrame() {
    var f = frameMode(); document.documentElement.setAttribute('data-frame', f);
    if (f === 'pc') { var s = Math.min(1, (innerHeight - 60) / 876, (innerWidth - 32) / 417); document.documentElement.style.setProperty('--fs', Math.max(0.45, s).toFixed(3)); }
  }
  function tickClock() { var d = new Date(), h = d.getHours() % 12 || 12; $('#sb-time').textContent = h + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }
  window.addEventListener('resize', function () { layoutFrame(); bindCarousel(); });
  window.addEventListener('hashchange', layoutFrame);
  layoutFrame(); tickClock(); setInterval(tickClock, 15000);
  setInterval(function () { if (store.state && ui.role === 'elder' && !eflow && enav.screen === 'home' && !sheet) render(); }, 60000);   // 시간이 지나면 '지금 할 일'이 바뀐다

  /* ---------- 시작 ---------- */
  (async function boot() {
    var splash = $('#splash'), t0 = Date.now(), ok = false;
    try { ok = await connect(); } catch (e) { ok = false; }
    if (!ok) startLocal();
    setTimeout(function () { splash.classList.add('out'); setTimeout(function () { splash.hidden = true; }, 500); }, Math.max(0, 3000 - (Date.now() - t0)));
  })();
})();
</script>
